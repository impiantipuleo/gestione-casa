name: Build iOS IPA

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-ios:
    name: Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: 📦 Install Dependencies
        run: npm ci

      - name: 🏗️ Build Web App
        run: npm run build

      - name: 🔄 Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: 🍏 Build Xcode Simulator App
        run: |
          cd ios/App
          xcodebuild build \
            -workspace App.xcworkspace \
            -scheme App \
            -destination 'generic/platform=iOS Simulator' \
            -configuration Release \
            -derivedDataPath build \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 📦 Package App into .ipa
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r build/Build/Products/Release-iphonesimulator/App.app Payload/
          zip -r GestioneCasa-iOS.ipa Payload

      - name: 📤 Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestioneCasa-iOS-App
          path: ios/App/GestioneCasa-iOS.ipa
          retention-days: 30
