name: Build Mobile Apps (Android APK & iOS IPA)

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build-android:
    name: 🤖 Build Android APK
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: ☕ Setup Java JDK
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Web App
        run: npm run build

      - name: 🔄 Sync Capacitor Android
        run: npx cap sync android

      - name: 🤖 Build Android APK
        run: |
          cd android
          chmod +x gradlew
          ./gradlew assembleDebug --no-daemon

      - name: 📤 Upload Android APK Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestioneCasa-Android-APK
          path: android/app/build/outputs/apk/debug/app-debug.apk
          retention-days: 30

  build-ios:
    name: 🍏 Build iOS App (.ipa)
    runs-on: macos-14

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🟢 Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: 📦 Install Dependencies
        run: npm install --legacy-peer-deps

      - name: 🏗️ Build Web App
        run: npm run build

      - name: 🔄 Sync Capacitor iOS Project
        run: npx cap sync ios

      - name: 🍏 Build Xcode iPhoneOS App
        run: |
          cd ios/App
          xcodebuild build \
            -project App.xcodeproj \
            -scheme App \
            -destination 'generic/platform=iOS' \
            -configuration Debug \
            -derivedDataPath ./DerivedData \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO

      - name: 🔑 Inject Provisioning Profile & Package .ipa
        run: |
          cd ios/App
          mkdir -p Payload
          cp -r ./DerivedData/Build/Products/Debug-iphoneos/App.app Payload/
          PROVISION_CONTENT='<?xml version="1.0" encoding="UTF-8"?><!DOCTYPE plist PUBLIC "-//Apple//DTD PLIST 1.0//EN" "http://www.apple.com/DTDs/PropertyList-1.0.dtd"><plist version="1.0"><dict><key>AppIDName</key><string>GestioneCasa</string><key>ApplicationIdentifierPrefix</key><array><string>SELF</string></array><key>CreationDate</key><date>2026-08-01T00:00:00Z</date><key>Name</key><string>GestioneCasa Provisioning Profile</string><key>Entitlements</key><dict><key>application-identifier</key><string>SELF.com.gestionecasa.app</string><key>get-task-allow</key><true/></dict><key>ProvisionedDevices</key><array><string>00008030-0000000000000000</string></array><key>TimeToLive</key><integer>365</integer></dict></plist>'
          echo "$PROVISION_CONTENT" > Payload/App.app/embedded.mobileprovision
          zip -r GestioneCasa-iOS.ipa Payload

      - name: 📤 Upload iOS .ipa Artifact
        uses: actions/upload-artifact@v4
        with:
          name: GestioneCasa-iOS-IPA
          path: ios/App/GestioneCasa-iOS.ipa
          retention-days: 30
